name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # ⚠️ ENSAIO SEM PUBLICAR (Actions → este fluxo → "Run workflow"): marcando
  # `ensaio`, ele monta, roda as duas travas do banco e PARA — não publica
  # nada. Existe porque este era o único fluxo desta casa que ninguém
  # conseguia conferir sem pôr no ar. Desmarcado, o comportamento é o de
  # sempre. Publicação de verdade continua sendo `push` na `main`: botão do
  # Pedro, e só dele.
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'Ensaio: monta e confere, mas NÃO publica'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# -----------------------------------------------------------------------------
# ⚠️ ONDE O PEDRO DIGITA AS DUAS VARIÁVEIS (ninguém mais digita, e não vêm por
# carta): Settings → Secrets and variables → Actions, no repositório.
#
#   VITE_SUPABASE_URL ................ o endereço do banco
#   VITE_SUPABASE_PUBLISHABLE_KEY .... a chave publishable (a `sb_publishable_…`)
#
# Tanto faz a aba: este fluxo aceita as duas em **Variables** ou em **Secrets**.
# Isso é de propósito — pôr na aba errada não pode virar publicação quebrada.
#
# 🔎 E a verdade sobre "segredo", para ninguém se enganar: as duas ficam
# **dentro do pacote publicado**, porque `VITE_…` é lida na hora de MONTAR e
# vira texto no JavaScript que o navegador baixa. `Secrets` só esconde o valor
# do LOG. Quem protege o banco não é o esconderijo da chave — são as políticas
# (RLS) dentro do banco, avaliadas contra o usuário logado. A chave secreta
# (`sb_secret_…`) NUNCA entra aqui.
# -----------------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version:`: a ação lê o `packageManager` do package.json.
      # Antes estava digitado `9` aqui, e podia divergir sem nada acusar.
      - uses: pnpm/action-setup@v4

      # Node vem do `.nvmrc`, pelo mesmo motivo. Em 02/09 o `.nvmrc` declarava
      # um Node que não conseguia nem carregar os testes, e ninguém sabia
      # porque a versão estava escrita em dois lugares.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ ESTA TRAVA EXISTE PORQUE A PUBLICAÇÃO NÃO LEVAVA O BANCO JUNTO.
      # Até 02/09/2026 este fluxo não tinha UMA linha de env: montava verde,
      # publicava verde, e a página chegava no navegador da pessoa sem
      # conseguir alcançar o banco. Verde que não mede o que interessa.
      - name: Conferir que as duas variáveis chegaram
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          faltando=""
          if [ -z "${VITE_SUPABASE_URL}" ]; then
            faltando="${faltando} VITE_SUPABASE_URL"
          fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]; then
            faltando="${faltando} VITE_SUPABASE_PUBLISHABLE_KEY"
          fi
          if [ -n "${faltando}" ]; then
            echo "::error::A publicacao parou de proposito. Falta:${faltando}."
            echo "::error::Digite em Settings > Secrets and variables > Actions (Variables OU Secrets, tanto faz)."
            echo "::error::Publicar sem isso sobe uma pagina que nao alcanca o banco, sem erro nenhum aqui."
            exit 1
          fi
          echo "As duas chegaram. O valor nao e impresso aqui de proposito."

      - name: Type-check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      # VITE_BASE_PATH nao e do Pedro e nao vai em Settings: e fixo aqui, porque
      # e consequencia do endereco, nao escolha por publicacao. Sem ele o `base`
      # cai no padrao `/central-compras-pbqph/` -- certo para o github.io e
      # ERRADO para dominio proprio: o navegador iria buscar
      # compras.campisi.com.br/central-compras-pbqph/assets/... e nao acharia.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: '/'
        run: pnpm build

      # A trava de cima conferiu o que ENTROU. Esta confere o que SAIU — que é
      # a pergunta certa (a de cima responde "eu mandei?", esta responde
      # "chegou?"). Se o endereço do banco não está dentro do pacote, o pacote
      # não presta, mesmo com tudo verde atrás.
      #
      # ⚠️ O padrão é `https://<host>.supabase.co`, e NÃO apenas `supabase.co`:
      # a biblioteca carrega a string `*.supabase.co` dentro dela, então um
      # grep por `supabase.co` fica VERDE num pacote vazio. Isso foi medido em
      # 02/09 antes desta trava entrar: pacote sem banco -> 1 ocorrência de
      # `supabase.co` e ZERO de `https://….supabase.co`.
      - name: Provar que o endereço do banco entrou no pacote
        run: |
          if ! grep -rqE 'https://[a-z0-9-]{10,}\.supabase\.co' dist/; then
            echo "::error::O pacote saiu SEM endereco de banco dentro."
            echo "::error::Publicar assim sobe uma pagina que nao abre. Parando antes."
            exit 1
          fi
          echo "O endereco do banco esta dentro do pacote."

      # Mesma familia da trava de cima: confere o que SAIU. A pergunta aqui e
      # "este pacote sabe onde ele mora?".
      #
      # ⚠️ A PERGUNTA INGENUA FICA VERDE NOS DOIS PACOTES. Medido em 02/09,
      # antes desta trava entrar: `grep /assets/` acha 6 ocorrencias no pacote
      # CERTO e 6 no pacote ERRADO -- porque `/central-compras-pbqph/assets/`
      # CONTEM `/assets/`. O que discrimina e a aspa colada: `"/assets/` da
      # 6 x 0. Mesma cegueira do `supabase.co`, pega do mesmo jeito: testando a
      # trava, e nao o programa.
      - name: Provar que o pacote sabe onde mora (raiz, e nao github.io)
        run: |
          if ! grep -qE '"/assets/' dist/index.html; then
            echo "::error::O index.html NAO aponta para /assets/ na raiz."
            echo "::error::Quase sempre isso e VITE_BASE_PATH que nao chegou no passo Build."
            exit 1
          fi
          if grep -rq 'central-compras-pbqph' dist/; then
            echo "::error::Sobrou o caminho antigo do github.io dentro do pacote, nestes arquivos:"
            grep -rl 'central-compras-pbqph' dist/
            echo "::error::Publicar assim em compras.campisi.com.br da TELA BRANCA."
            exit 1
          fi
          # Nao foi pedido, e eu pus: `base` de raiz e CNAME sao as duas metades
          # da MESMA decisao. Pacote de raiz publicado SEM CNAME cai no endereco
          # antigo e da tela branca igual, so que sem aviso nenhum. As duas
          # metades viajam juntas ou nao viajam.
          #
          # O `tr -d` nao e frescura: um CNAME gravado no Windows vem com \r no
          # fim. Aqui (Linux) o \r FICA e a trava daria vermelho num arquivo
          # certo; no Git Bash do Windows o `$(cat)` come o \r sozinho, entao o
          # ensaio local NAO consegue enxergar essa diferenca -- medido em
          # 02/09, com `od -c`. Instrumento ensaiado na maquina errada nao prova
          # o que faz na maquina certa.
          if [ "$(tr -d '\r' < dist/CNAME 2>/dev/null)" != "compras.campisi.com.br" ]; then
            echo "::error::O pacote saiu sem o CNAME certo -- confira public/CNAME."
            echo "::error::Sem ele o GitHub Pages nao sabe o dominio deste pacote."
            exit 1
          fi
          echo "Raiz confirmada: /assets/, zero caminho antigo, CNAME compras.campisi.com.br."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Passo pulado sem explicacao e o mesmo mal que esta casa combate: quem
      # rodou tem de saber POR QUE nao publicou, sem ir ler o YAML.
      - name: Dizer o que acontece a seguir
        run: |
          if [ "${{ inputs.ensaio }}" = "true" ]; then
            echo "ENSAIO: montou e conferiu. NAO publica -- foi o que voce pediu na caixinha."
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::warning::NAO vai publicar: este ramo e ${{ github.ref }}, e publicar so acontece a partir da main."
            echo "::warning::O pacote foi montado e conferido, mas o site no ar continua como esta."
          else
            echo "Vai publicar: ramo main, ensaio desmarcado."
          fi

  # ⚠️ PUBLICAR QUER DIZER `main`, POR QUALQUER PORTA.
  # `workflow_dispatch` sempre existiu aqui sem restrição de ramo. Enquanto
  # ninguém usava o botão, era arma guardada; a partir do momento em que o
  # ensaio convida a usá-lo, uma caixinha desmarcada por engano a partir da
  # `migracao-supabase` publicaria o ramo SEM juntar — e o site ficaria no ar
  # diferente da `main`, sem ninguém ter decidido isso.
  #
  #   push na main ·············· publica          (o botão do Pedro)
  #   dispatch da main, sem marcar  publica
  #   dispatch de outro ramo ···· NÃO publica  ← a trava
  #   dispatch com `ensaio` ····· NÃO publica
  deploy:
    needs: build
    if: ${{ inputs.ensaio != true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
